<div class="modal" (click)="closed.emit()"><section class="modal__surface modal__surface--form" role="dialog" aria-modal="true" aria-labelledby="retry-review-title" tabindex="-1" (click)="$event.stopPropagation()">
  <header class="modal__header"><div><p class="eyebrow">Revise previous version</p><h2 id="retry-review-title">Request changes</h2></div><button class="icon-button" type="button" aria-label="Close revision form" (click)="closed.emit()">×</button></header>
  <form #retryForm="ngForm" (ngSubmit)="submit(retryForm)" novalidate><div class="form-field"><label for="retry-prompt">New prompt</label><textarea id="retry-prompt" name="retryPrompt" [(ngModel)]="prompt" required maxlength="100000" rows="7" placeholder="Describe what should change in the previous implementation…"></textarea><small>The AI will be told to modify the existing previous version.</small></div><div class="form-error" role="alert" *ngIf="apiError">{{ apiError }}</div><footer class="modal__footer"><button class="button button--quiet" type="button" (click)="closed.emit()">Cancel</button><button class="button button--primary" type="submit" [disabled]="saving">{{ saving ? 'Queuing…' : 'Queue revision' }}</button></footer></form>
</section></div>
