<div
  class="header-usage"
  [class.header-usage--unavailable]="usage !== null && !usage.available"
  [attr.title]="statusTitle()"
  aria-label="Codex remaining usage"
>
  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
    <path d="M13.2 2 5.5 13h5.8l-.5 9 7.7-11h-5.8l.5-9Z" />
  </svg>
  <span class="header-usage__name">Codex</span>
  <span class="header-usage__status" *ngIf="usage === null">Checking…</span>
  <span class="header-usage__status" *ngIf="usage !== null && !usage.available">Unavailable</span>
  <span class="header-usage__window" *ngFor="let window of usageWindows()">
    <small>{{ windowLabel(window) }}</small>
    <strong>{{ window.remainingPercent }}%</strong>
    <span class="header-usage__meter" role="meter" aria-label="Codex remaining usage" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="window.remainingPercent">
      <i [style.width.%]="window.remainingPercent"></i>
    </span>
  </span>
</div>
