<section class="kanban" aria-label="Task status board" [attr.aria-busy]="loading">
  <article class="kanban-column" *ngFor="let column of columns" [attr.data-status]="column.status" [attr.aria-labelledby]="'column-' + column.status">
    <header class="column-header">
      <div><span class="status-indicator" aria-hidden="true"></span><h3 [id]="'column-' + column.status">{{ column.label }}</h3><span class="column-count">{{ tasksFor(column.status).length }}</span></div>
      <p>{{ column.hint }}</p>
    </header>
    <div class="task-list">
      <article class="task-card" *ngFor="let task of tasksFor(column.status); trackBy: trackTask" [class.task-card--pending]="isPending(task.id)">
        <button class="task-card__main" type="button" (click)="taskOpened.emit(task)">
          <span class="task-card__topline"><span class="priority" [attr.data-priority]="task.priority"><span class="priority-dot" aria-hidden="true"></span>{{ task.priority | titlecase }}</span><span class="task-number">#{{ task.id }}</span></span>
          <strong>{{ task.title }}</strong>
          <span class="project-name" [title]="projectName(task.project_id)">{{ projectName(task.project_id) }}</span>
          <span class="status-chip" data-status="REJECTED" *ngIf="task.is_rejected">Rejected</span>
          <span class="latest-result"><span class="sr-only">Latest run result: </span>{{ latestResult(task) }}</span>
          <span class="status-chip" [attr.data-status]="task.status" [class.status-chip--paused]="task.is_paused">{{ task.is_paused ? 'Paused' : statusLabel(task.status) }}</span>
        </button>
        <div class="task-card__actions" *ngIf="task.status === 'TODO' || task.status === 'IN_REVIEW' || task.status === 'PENDING_PUSH' || task.status === 'PENDING_BRANCH_REMOVAL' || task.status === 'FAILED'">
          <button *ngIf="task.status === 'TODO'" class="inline-action inline-action--pause" type="button" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); pauseToggled.emit(task)">{{ isPending(task.id) ? 'Updating…' : (task.is_paused ? 'Resume' : 'Pause') }}</button>
          <button *ngIf="task.status === 'PENDING_BRANCH_REMOVAL'" class="inline-action inline-action--cleanup" type="button" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); branchRemovalRequested.emit(task)">{{ isPending(task.id) ? 'Removing…' : 'Approve removal' }}</button>
          <button *ngIf="task.status === 'PENDING_PUSH'" class="inline-action inline-action--push" type="button" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); pushRequested.emit(task)">{{ isPending(task.id) ? 'Pushing…' : 'Confirm push' }}</button>
          <button *ngIf="task.status === 'IN_REVIEW'" mat-icon-button class="review-icon-action review-icon-action--retry" type="button" title="Request changes" aria-label="Request changes" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); reviewRetryRequested.emit(task)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-4.6 7H5.3A7 7 0 1 0 12 5Z"/></svg></button>
          <button *ngIf="task.status === 'IN_REVIEW'" mat-icon-button class="review-icon-action review-icon-action--reject" type="button" title="Reject" aria-label="Reject task" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); rejectRequested.emit(task)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7.4 6 4.6 4.6L16.6 6 18 7.4 13.4 12l4.6 4.6-1.4 1.4-4.6-4.6L7.4 18 6 16.6l4.6-4.6L6 7.4Z"/></svg></button>
          <button *ngIf="task.status === 'IN_REVIEW'" mat-icon-button class="review-icon-action review-icon-action--approve" type="button" title="Approve" aria-label="Approve task" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); approveRequested.emit(task)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 16.2-3.5-3.5L4.1 14.1 9 19 20.3 7.7l-1.4-1.4Z"/></svg></button>
          <button *ngIf="task.status === 'FAILED'" class="inline-action inline-action--retry" type="button" [disabled]="isPending(task.id)" (click)="$event.stopPropagation(); retryRequested.emit(task)">{{ isPending(task.id) ? 'Queuing…' : 'Retry' }}</button>
        </div>
      </article>
      <div class="column-empty" *ngIf="tasksFor(column.status).length === 0"><span aria-hidden="true">—</span><p>No tasks</p></div>
    </div>
  </article>
</section>
