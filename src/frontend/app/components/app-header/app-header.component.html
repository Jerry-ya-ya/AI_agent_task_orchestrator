<header class="topbar">
  <div class="brand-block">
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div><p class="eyebrow">Local task orchestration</p><h1>Agentboard</h1></div>
  </div>
  <div class="topbar-actions">
    <div class="runtime-states">
      <div class="connection-state" [class.connection-state--online]="connected" [title]="connected ? 'Connected to ' + apiBaseUrl : 'Backend unavailable at ' + apiBaseUrl">
        <span class="connection-dot" aria-hidden="true"></span><span>{{ connected ? 'Backend online' : 'Offline' }}</span>
      </div>
      <div class="worker-state" [class.worker-state--ready]="workerReady()" [class.worker-state--warning]="workerWarning()" [title]="workerStateTitle()">
        <span class="worker-state__dot" aria-hidden="true"></span><span>{{ workerStateLabel() }}</span>
      </div>
    </div>
    <header-usage [usage]="agentUsage" />
    <button class="button button--quiet" type="button" (click)="createProject.emit()">New project</button>
    <button class="button button--primary" type="button" (click)="createTask.emit()" [attr.aria-describedby]="projectCount === 0 ? 'create-task-hint' : null"><span aria-hidden="true">＋</span> New task</button>
    <button class="window-control worker-toggle" type="button" [disabled]="!connected || !workerStatus?.running" [attr.aria-label]="workerPaused() ? 'Resume task worker' : 'Pause task worker'" [title]="workerPaused() ? 'Resume task processing' : 'Pause after the current task'" (click)="workerToggled.emit()">
      <svg *ngIf="workerPaused(); else pauseIcon" class="worker-toggle__play" aria-hidden="true" viewBox="0 0 16 16" focusable="false"><path d="M5 3.5v9l7-4.5z" /></svg>
      <ng-template #pauseIcon><svg class="worker-toggle__pause" aria-hidden="true" viewBox="0 0 16 16" focusable="false"><path d="M5 3.5v9M11 3.5v9" /></svg></ng-template>
    </button>
    <button class="window-control window-minimize" type="button" aria-label="Minimize application" title="Minimize" (click)="minimizeApplication.emit()">
      <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false"><path d="M3 8.5h10" /></svg>
    </button>
    <button class="window-control window-close" type="button" aria-label="Close application" title="Close" (click)="closeApplication.emit()">
      <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false"><path d="M3.5 3.5l9 9m0-9l-9 9" /></svg>
    </button>
  </div>
</header>
