<aside class="app-navigation" [class.app-navigation--expanded]="expanded">
  <button
    class="navigation-toggle"
    type="button"
    [attr.aria-label]="expanded ? 'Collapse navigation' : 'Expand navigation'"
    [attr.title]="expanded ? 'Collapse navigation' : 'Expand navigation'"
    [attr.aria-expanded]="expanded"
    (click)="expandedChange.emit(!expanded)"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <rect x="3.5" y="4" width="17" height="16" rx="2.5" />
      <path d="M9 4v16M13 9h4M13 15h4" />
    </svg>
    <span class="navigation-label">Navigation</span>
  </button>

  <nav class="navigation-links" aria-label="Main navigation">
    <button
      class="navigation-link"
      type="button"
      [class.navigation-link--active]="activePage === 'features'"
      [class.navigation-link--dragging]="draggingPage === 'features'"
      [attr.aria-current]="activePage === 'features' ? 'page' : null"
      title="Features and branches"
      (click)="selectPage($event, 'features')"
      (pointerdown)="beginPageDrag($event, 'features')"
      (pointermove)="continuePageDrag($event, 'features')"
      (pointerup)="finishPageDrag($event)"
      (pointercancel)="finishPageDrag($event)"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <circle cx="6" cy="5" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="8" cy="19" r="2" />
        <path d="M6 7v4a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V10M8 17v-2" />
      </svg>
      <span class="navigation-label">Features</span>
    </button>

    <button
      class="navigation-link"
      type="button"
      [class.navigation-link--active]="activePage === 'taskboard'"
      [class.navigation-link--dragging]="draggingPage === 'taskboard'"
      [attr.aria-current]="activePage === 'taskboard' ? 'page' : null"
      title="Taskboard"
      (click)="selectPage($event, 'taskboard')"
      (pointerdown)="beginPageDrag($event, 'taskboard')"
      (pointermove)="continuePageDrag($event, 'taskboard')"
      (pointerup)="finishPageDrag($event)"
      (pointercancel)="finishPageDrag($event)"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <rect x="3.5" y="4" width="7" height="16" rx="2" />
        <rect x="13.5" y="4" width="7" height="10" rx="2" />
      </svg>
      <span class="navigation-label">Taskboard</span>
    </button>

    <button
      class="navigation-link"
      type="button"
      [class.navigation-link--active]="activePage === 'history'"
      [class.navigation-link--dragging]="draggingPage === 'history'"
      [attr.aria-current]="activePage === 'history' ? 'page' : null"
      title="Task history"
      (click)="selectPage($event, 'history')"
      (pointerdown)="beginPageDrag($event, 'history')"
      (pointermove)="continuePageDrag($event, 'history')"
      (pointerup)="finishPageDrag($event)"
      (pointercancel)="finishPageDrag($event)"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="M4 7h16M7 3v4M17 3v4M5 7v12h14V7M8 11h3M8 15h5" />
      </svg>
      <span class="navigation-label">Task history</span>
      <span class="navigation-count" *ngIf="historyCount > 0">{{ historyCount }}</span>
    </button>
    <div class="navigation-connections" *ngIf="connections.length > 0 || expanded">
      <div class="navigation-connections__heading" *ngIf="expanded"><span>Frontends</span><button type="button" title="Connect local frontend" aria-label="Connect local frontend" (click)="connectionCreateRequested.emit()">＋</button></div>
      <button
        *ngFor="let connection of connections"
        class="navigation-link navigation-link--connection"
        type="button"
        [class.navigation-link--active]="activeConnectionId === connection.id"
        [class.navigation-link--dragging]="draggingConnectionId === connection.id"
        [attr.aria-current]="activeConnectionId === connection.id ? 'page' : null"
        [attr.title]="connection.name"
        (click)="selectConnection($event, connection)"
        (pointerdown)="beginPageDrag($event, 'frontend', connection.id)"
        (pointermove)="continuePageDrag($event, 'frontend', connection.id)"
        (pointerup)="finishPageDrag($event)"
        (pointercancel)="finishPageDrag($event)"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><rect x="3.5" y="4.5" width="17" height="14" rx="2" /><path d="M3.5 8.5h17M7 6.5h.01M10 6.5h.01M8 21h8" /></svg>
        <span class="navigation-label">{{ connection.name }}</span>
      </button>
    </div>
    <button
      *ngIf="!expanded"
      class="navigation-link navigation-link--connection-add"
      type="button"
      title="Connect local frontend"
      aria-label="Connect local frontend"
      (click)="connectionCreateRequested.emit()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M12 8v8M8 12h8" /></svg>
      <span class="navigation-label">Connect frontend</span>
    </button>
    <button
      class="navigation-link navigation-link--settings"
      type="button"
      [class.navigation-link--active]="activePage === 'settings'"
      [class.navigation-link--dragging]="draggingPage === 'settings'"
      [attr.aria-current]="activePage === 'settings' ? 'page' : null"
      title="Settings"
      (click)="selectPage($event, 'settings')"
      (pointerdown)="beginPageDrag($event, 'settings')"
      (pointermove)="continuePageDrag($event, 'settings')"
      (pointerup)="finishPageDrag($event)"
      (pointercancel)="finishPageDrag($event)"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="M10 2.9h4l.6 2.1 1.8.8 2-.9 2.8 2.8-.9 2 .8 1.8 2.1.6v4l-2.1.6-.8 1.8.9 2-2.8 2.8-2-.9-1.8.8-.6 2.1h-4l-.6-2.1-1.8-.8-2 .9-2.8-2.8.9-2-.8-1.8-2.1-.6v-4l2.1-.6.8-1.8-.9-2 2.8-2.8 2 .9 1.8-.8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <span class="navigation-label">Settings</span>
    </button>
  </nav>
</aside>
