<div
  #graphHost
  class="cytoscape-branch-graph"
  role="img"
  [style.height.px]="graphHeight"
  [attr.aria-label]="'Interactive Git branch graph for ' + map.project.name"
></div>
<p class="cytoscape-branch-graph__hint">Scroll to zoom, drag the canvas to pan, and select a task node to open its details.</p>
