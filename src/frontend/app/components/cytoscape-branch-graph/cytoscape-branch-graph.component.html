<div class="cytoscape-branch-graph__toolbar">
  <span>Interactive branch canvas</span>
  <div class="cytoscape-branch-graph__controls">
    <label class="cytoscape-branch-graph__speed">
      <span>Zoom speed</span>
      <select [value]="zoomSensitivity" (change)="setZoomSensitivity($any($event.target).value)">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
      </select>
    </label>
    <button
      type="button"
      class="cytoscape-branch-graph__reset"
      [disabled]="!graphReady"
      (click)="resetView()"
      title="Reset zoom and position"
      aria-label="Reset branch graph view"
    ><span aria-hidden="true">↺</span> Reset view</button>
    <button
      type="button"
      class="cytoscape-branch-graph__reset cytoscape-branch-graph__reset--danger"
      [disabled]="!graphReady || !hasResettableBranches() || hasProtectedPointerTasks()"
      (click)="allBranchesResetRequested.emit(map.project.id)"
      [title]="hasProtectedPointerTasks() ? 'Finish In review, Reviewing, and Pending push tasks before resetting branch pointers' : 'Reset every local Feature branch pointer to latest main'"
      aria-label="Reset all Feature branch pointers to latest main"
    ><span aria-hidden="true">↺</span> Reset all to main</button>
  </div>
</div>
<div
  #graphHost
  class="cytoscape-branch-graph"
  role="img"
  [attr.aria-label]="'Interactive Git branch graph for ' + map.project.name"
></div>
<p class="cytoscape-branch-graph__hint">Scroll to zoom, drag to pan, select a task for details, or open the endpoint ＋ for branch actions.</p>
