<div class="modal" (click)="closed.emit()">
  <section class="modal__surface modal__surface--form" role="dialog" aria-modal="true" aria-labelledby="task-dialog-title" tabindex="-1" (click)="$event.stopPropagation()">
    <header class="modal__header"><div><p class="eyebrow">{{ mode === 'edit' ? 'Update instructions' : 'Queue agent work' }}</p><h2 id="task-dialog-title">{{ mode === 'edit' ? 'Edit task' : 'Create task' }}</h2></div><button class="icon-button" type="button" aria-label="Close task form" (click)="closed.emit()">×</button></header>
    <form #taskForm="ngForm" (ngSubmit)="submit(taskForm)" novalidate>
      <div class="form-grid">
        <div class="form-field form-field--wide"><label for="task-title">Title</label><input id="task-title" name="taskTitle" type="text" required maxlength="200" autocomplete="off" placeholder="Implement login API" [(ngModel)]="draft.title" #taskTitle="ngModel" /><small *ngIf="taskTitle.invalid && taskTitle.touched" class="field-error">Enter a task title.</small></div>
        <div class="form-field"><label for="task-project">Project</label><select id="task-project" name="taskProject" required [(ngModel)]="draft.project_id" (ngModelChange)="projectChanged()"><option [ngValue]="null" disabled>Select project</option><option *ngFor="let project of projects" [ngValue]="project.id">{{ project.name }}</option></select></div>
        <div class="form-field"><label for="task-feature">Feature</label><select id="task-feature" name="taskFeature" required [(ngModel)]="draft.feature_id"><option [ngValue]="null" disabled>Select feature</option><option *ngFor="let feature of projectFeatures()" [ngValue]="feature.id">{{ feature.name }} · {{ feature.branch_name }}</option></select><small>Tasks in this feature are committed and pushed to the same branch.</small></div>
        <div class="form-field"><label for="task-priority">Priority</label><select id="task-priority" name="taskPriority" required [(ngModel)]="draft.priority"><option *ngFor="let priority of priorities" [ngValue]="priority">{{ priority | titlecase }}</option></select></div>
        <div class="form-field"><label for="task-model-effort">Model strength</label><select id="task-model-effort" name="taskModelEffort" required [(ngModel)]="draft.model_effort"><option *ngFor="let effort of modelEfforts" [ngValue]="effort">{{ modelEffortLabel(effort) }}</option></select><small>Controls how much reasoning Codex uses for this task.</small></div>
        <div class="form-field form-field--wide"><label for="task-description">Description</label><textarea id="task-description" name="taskDescription" rows="8" maxlength="30000" placeholder="Describe the outcome, constraints, and acceptance criteria…" [(ngModel)]="draft.description"></textarea></div>
      </div>
      <div class="form-error" role="alert" *ngIf="apiError">{{ apiError }}</div>
      <footer class="modal__footer"><button class="button button--quiet" type="button" (click)="closed.emit()">Cancel</button><button class="button button--primary" type="submit" [disabled]="saving">{{ saving ? 'Saving…' : mode === 'edit' ? 'Save changes' : 'Create task' }}</button></footer>
    </form>
  </section>
</div>
