<div class="modal" (click)="closed.emit()">
  <section class="modal__surface modal__surface--form" role="dialog" aria-modal="true" aria-labelledby="feature-dialog-title" tabindex="-1" (click)="$event.stopPropagation()">
    <header class="modal__header"><div><p class="eyebrow">Shared delivery branch</p><h2 id="feature-dialog-title">Create feature</h2></div><button class="icon-button" type="button" aria-label="Close feature form" (click)="closed.emit()">×</button></header>
    <form #featureForm="ngForm" (ngSubmit)="submit(featureForm)" novalidate>
      <div class="form-field"><label for="feature-project">Project</label><select id="feature-project" name="featureProject" required [(ngModel)]="draft.project_id"><option [ngValue]="null" disabled>Select project</option><option *ngFor="let project of projects" [ngValue]="project.id">{{ project.name }}</option></select></div>
      <div class="form-field"><label for="feature-name">Feature name</label><input id="feature-name" name="featureName" type="text" required maxlength="200" autocomplete="off" placeholder="Authentication" [(ngModel)]="draft.name" #featureName="ngModel" /><small>The branch uses the format feature/authentication and is created when its first task starts. Non-Latin names and branch-name collisions receive a stable short suffix automatically.</small><small *ngIf="featureName.invalid && featureName.touched" class="field-error">Enter a feature name.</small></div>
      <div class="form-error" role="alert" *ngIf="apiError">{{ apiError }}</div>
      <footer class="modal__footer"><button class="button button--quiet" type="button" (click)="closed.emit()">Cancel</button><button class="button button--primary" type="submit" [disabled]="saving">{{ saving ? 'Creating…' : 'Create feature' }}</button></footer>
    </form>
  </section>
</div>
