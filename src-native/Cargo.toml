[package]
name = "agentboard-native"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
dirs = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
